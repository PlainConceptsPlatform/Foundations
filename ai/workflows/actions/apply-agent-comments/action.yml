name: Apply agent comments
description: Read add_comment items from agent_output.json and post each via gh.
inputs:
  output-file:
    description: Path to agent_output.json.
    required: true
  token:
    description: GitHub token with issues:write and pull-requests:write.
    required: true
  repo:
    description: Target repository in owner/name format.
    required: false
    default: ${{ github.repository }}
runs:
  using: composite
  steps:
    - name: Post comments
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        OUTPUT_FILE: ${{ inputs.output-file }}
        REPO: ${{ inputs.repo }}
      run: |
        set -euo pipefail
        [ -f "$OUTPUT_FILE" ] || exit 0
        jq -c '.items[] | select(.type == "add_comment")' "$OUTPUT_FILE" | while read -r item; do
          BODY=$(echo "$item" | jq -r '.body')
          NUM=$(echo "$item" | jq -r '.item_number // empty')
          [ -n "$NUM" ] && gh issue comment "$NUM" --repo "$REPO" --body "$BODY"
        done
