name: Close agent issues
description: Read close_issue items from agent_output.json and close each via gh.
inputs:
  output-file:
    description: Path to agent_output.json.
    required: true
  token:
    description: GitHub token with issues:write.
    required: true
  repo:
    description: Target repository in owner/name format.
    required: false
    default: ${{ github.repository }}
runs:
  using: composite
  steps:
    - name: Close issues
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        OUTPUT_FILE: ${{ inputs.output-file }}
        REPO: ${{ inputs.repo }}
      run: |
        set -euo pipefail
        [ -f "$OUTPUT_FILE" ] || exit 0

        jq -c '.items[] | select(.type == "close_issue")' "$OUTPUT_FILE" | while read -r item; do
          NUM=$(echo "$item" | jq -r '.item_number')
          REASON=$(echo "$item" | jq -r '.state_reason // empty')
          if [ "$REASON" = "not_planned" ]; then
            gh issue close "$NUM" --repo "$REPO" --reason "not planned"
          else
            gh issue close "$NUM" --repo "$REPO" --reason "completed"
          fi
        done
