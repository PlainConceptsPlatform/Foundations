name: Link agent sub-issues
description: Read link_sub_issue items from agent_output.json and link each via GraphQL.
inputs:
  output-file:
    description: Path to agent_output.json.
    required: true
  token:
    description: GitHub token with issues:write.
    required: true
runs:
  using: composite
  steps:
    - name: Link sub-issues
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        OUTPUT_FILE: ${{ inputs.output-file }}
      run: |
        set -euo pipefail
        [ -f "$OUTPUT_FILE" ] || exit 0

        jq -c '.items[] | select(.type == "link_sub_issue")' "$OUTPUT_FILE" | while read -r item; do
          PARENT=$(echo "$item" | jq -r '.parent_number // .parent // empty')
          CHILD=$(echo "$item" | jq -r '.child_number // .child // empty')
          [ -n "$PARENT" ] && [ -n "$CHILD" ] && \
            gh api graphql -f query='
              mutation($p:ID!,$c:ID!){addSubIssue(input:{issueId:$p,subIssueId:$c}){subIssue{number}}}' \
              -f p="$PARENT" -f c="$CHILD" 2>/dev/null || \
            echo "link_sub_issue: failed for $PARENT -> $CHILD, skipping"
        done
