name: Load issue comments
description: Load all comments for an issue into the runner temporary directory.
inputs:
  token:
    description: GitHub token used by github-script.
    required: true
  issue-number:
    description: Issue number whose comments should be loaded.
    required: true
  output-path:
    description: Absolute path where comments are written.
    required: true
outputs:
  loaded:
    description: Whether comments were loaded.
    value: ${{ steps.load.outputs.loaded }}
runs:
  using: composite
  steps:
    - name: Fetch issue comments
      id: load
      uses: actions/github-script@v9
      env:
        ISSUE_NUMBER: ${{ inputs.issue-number }}
        OUTPUT_PATH: ${{ inputs.output-path }}
      with:
        github-token: ${{ inputs.token }}
        script: |
          core.setOutput('loaded', 'false');

          const fs = require('fs');
          const path = require('path');
          const comments = await github.paginate(github.rest.issues.listComments, {
            ...context.repo,
            issue_number: Number(process.env.ISSUE_NUMBER),
            per_page: 100,
          });

          fs.mkdirSync(path.dirname(process.env.OUTPUT_PATH), { recursive: true });
          fs.writeFileSync(process.env.OUTPUT_PATH, JSON.stringify(comments));
          core.setOutput('loaded', 'true');
