name: Push agent branch
description: Read push_to_pull_request_branch from agent_output.json, apply the git bundle, and push.
inputs:
  output-file:
    description: Path to agent_output.json.
    required: true
  bundle-file:
    description: Path to the git bundle from the agent artifact.
    required: false
    default: ''
  token:
    description: GitHub token with contents:write.
    required: true
runs:
  using: composite
  steps:
    - name: Configure git credentials
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
      run: |
        git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"
    - name: Push to pull request branch
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        OUTPUT_FILE: ${{ inputs.output-file }}
        BUNDLE_FILE: ${{ inputs.bundle-file }}
      run: |
        set -euo pipefail
        [ -f "$OUTPUT_FILE" ] || exit 0

        ITEM=$(jq -c '.items[] | select(.type == "push_to_pull_request_branch")' "$OUTPUT_FILE")
        [ -n "$ITEM" ] || exit 0

        BRANCH=$(echo "$ITEM" | jq -r '.branch')
        if [ -n "$BUNDLE_FILE" ] && [ -f "$BUNDLE_FILE" ]; then
          git fetch origin "$BRANCH"
          git checkout "$BRANCH"
          git am "$BUNDLE_FILE" || git apply "$BUNDLE_FILE"
          git push origin "$BRANCH"
        fi
