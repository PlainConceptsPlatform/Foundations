name: Validate issue
description: Validate an open issue against required and blocked labels.
inputs:
  token:
    description: GitHub token used by github-script.
    required: true
  issue-number:
    description: Issue number to validate.
    required: true
  required-labels:
    description: Newline-delimited labels that must all exist.
    required: false
    default: ''
  blocked-labels:
    description: Newline-delimited labels that must not exist.
    required: false
    default: ''
  output-path:
    description: Absolute path where the issue payload is written.
    required: true
outputs:
  found:
    description: Whether the issue is eligible.
    value: ${{ steps.validate.outputs.found }}
runs:
  using: composite
  steps:
    - name: Validate issue state and labels
      id: validate
      uses: actions/github-script@v9
      env:
        ISSUE_NUMBER: ${{ inputs.issue-number }}
        REQUIRED_LABELS: ${{ inputs.required-labels }}
        BLOCKED_LABELS: ${{ inputs.blocked-labels }}
        OUTPUT_PATH: ${{ inputs.output-path }}
      with:
        github-token: ${{ inputs.token }}
        script: |
          core.setOutput('found', 'false');

          const fs = require('fs');
          const path = require('path');
          const issueNumber = Number(process.env.ISSUE_NUMBER);
          const issue = await github.rest.issues.get({ ...context.repo, issue_number: issueNumber });
          const labels = new Set(issue.data.labels.map(({ name }) => name));
          const requiredLabels = process.env.REQUIRED_LABELS.split(/\r?\n/).filter(Boolean);
          const blockedLabels = process.env.BLOCKED_LABELS.split(/\r?\n/).filter(Boolean);
          const isOpenIssue = !issue.data.pull_request && issue.data.state === 'open';
          const hasRequiredLabels = requiredLabels.every((label) => labels.has(label));
          const hasNoBlockedLabels = blockedLabels.every((label) => !labels.has(label));

          if (!isOpenIssue || !hasRequiredLabels || !hasNoBlockedLabels) return;

          fs.mkdirSync(path.dirname(process.env.OUTPUT_PATH), { recursive: true });
          fs.writeFileSync(process.env.OUTPUT_PATH, JSON.stringify(issue.data));
          core.setOutput('found', 'true');
