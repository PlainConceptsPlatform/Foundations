name: Update agent issues
description: Read update_issue items from agent_output.json and update each via gh.
inputs:
  output-file:
    description: Path to agent_output.json.
    required: true
  token:
    description: GitHub token with issues:write.
    required: true
  repo:
    description: Target repository in owner/name format.
    required: false
    default: ${{ github.repository }}
runs:
  using: composite
  steps:
    - name: Update issues
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        OUTPUT_FILE: ${{ inputs.output-file }}
        REPO: ${{ inputs.repo }}
      run: |
        set -euo pipefail
        [ -f "$OUTPUT_FILE" ] || exit 0

        jq -c '.items[] | select(.type == "update_issue")' "$OUTPUT_FILE" | while read -r item; do
          NUM=$(echo "$item" | jq -r '.item_number')
          BODY=$(echo "$item" | jq -r '.body // empty')
          TITLE=$(echo "$item" | jq -r '.title // empty')
          ARGS=(--repo "$REPO")
          [ -n "$BODY" ] && ARGS+=(--body "$BODY")
          [ -n "$TITLE" ] && ARGS+=(--title "$TITLE")
          gh issue edit "$NUM" "${ARGS[@]}"
        done
