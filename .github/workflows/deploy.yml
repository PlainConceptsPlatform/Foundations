name: Deploy showcase (Azure App Service)

on:
  push:
    branches: [main]
  workflow_dispatch:

# The docs site is a Next.js Node server deployed to Azure App Service (a Web App,
# not Static Web Apps). Put login in front with App Service Authentication
# (Easy Auth) configured for Entra ID in the Azure portal or via infra as code.
#
# Target resource:
#   App Service : platformfoundations-pro-app-01
#   Resource gp : chapterapps-pro-rg-01
#   Subscription: b3c60938-eafe-4862-8f84-54c16ee8cd1c  (tenant plain.onmicrosoft.com)
#
# Azure-side setup required once (portal or az; not done by this workflow):
#   1. App Service runtime = Node 20 (Linux).
#   2. Startup command:  node apps/docs/server.js
#   3. Authentication: add the Microsoft (Entra ID) provider, "require authentication".
#   4. Download the publish profile and add it as the repo secret AZURE_WEBAPP_PUBLISH_PROFILE.

env:
  AZURE_WEBAPP_NAME: platformfoundations-pro-app-01
  NODE_VERSION: "20"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build (standalone)
        run: pnpm --filter @plainconceptsplatform/docs build
      - name: Assemble standalone bundle
        working-directory: apps/docs
        run: |
          cp -r .next/static .next/standalone/apps/docs/.next/static
          if [ -d public ]; then cp -r public .next/standalone/apps/docs/public; fi
      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: apps/docs/.next/standalone
