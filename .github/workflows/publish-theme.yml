name: Publish theme

# Publishes @plainconceptsplatform/ui-theme to GitHub Packages (private).
# Trigger by pushing a tag like ui-theme-v0.1.0, or run manually.
# Bump packages/theme/package.json "version" before tagging.

on:
  push:
    tags: ["ui-theme-v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://npm.pkg.github.com
          scope: "@plainconceptsplatform"
      - run: pnpm install --frozen-lockfile
      - name: Publish
        working-directory: packages/theme
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
