name: Proposal
description: Suggest a convention, a token, or something shared.
labels: [proposal]
body:
  - type: markdown
    attributes:
      value: |
        The bar for shared code: the **same real requirement has already appeared in multiple apps**.
        Until then it belongs in the app that needs it. A documented convention beats new shared code
        whenever it will do the job.

  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What is painful today, in which apps.
    validations:
      required: true

  - type: input
    id: apps
    attributes:
      label: Which apps have hit this
      description: Name them. One app is a signal, not a case for sharing.
    validations:
      required: true

  - type: dropdown
    id: kind
    attributes:
      label: What are you proposing
      options:
        - A convention (documented, no new code)
        - A token or token group
        - A shared component
        - A change to an existing published package
        - Tooling or automation
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: The proposal
      description: What you want, and the smallest version of it that would help.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: What you have already tried or ruled out
